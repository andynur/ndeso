# The gate every PR must pass. The steps below mirror `bun run ci` stage by stage
# (TESTING §1) — split up only so a failure names itself in the checks UI. Keep the two
# in step: the composition of each stage lives in package.json, never here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch cancels the run it supersedes; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun's install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Fails if bun.lock is out of date, so a dependency can never sneak in unpinned.
      - name: Install
        run: bun install --frozen-lockfile

      # types + lint + deps + i18n + content + tests (AGENTS rule 6).
      - name: Check
        run: bun run check

      # Coverage on CI only (TECH_STACK §4). The suite runs in milliseconds, so a second
      # run is cheaper than making `bun test` itself conditional.
      - name: Coverage
        run: bun test --coverage

      - name: Build
        run: bun run build && bun run check:size

      - name: Smoke
        run: bun run smoke

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # Publishes the built client so the game can be opened on a phone from anywhere. Cloud
  # agent sessions are disposable and their dev server is unreachable, so without this
  # there is no way to actually look at what was built.
  #
  # A second job rather than a second workflow: `needs: check` guarantees nothing broken
  # ever reaches the URL, and there is one place where the build command lives.
  #
  # ONE-TIME SETUP, both by a repository admin — until then this job is skipped, not failed:
  #   1. Settings -> Pages -> Source: "GitHub Actions"
  #   2. Settings -> Secrets and variables -> Actions -> Variables -> DEPLOY_PAGES = true
  #
  # The variable exists because step 1 cannot be automated: `configure-pages` has an
  # `enablement` option, but turning Pages on needs repository-administration rights that
  # a `permissions:` block cannot grant to GITHUB_TOKEN. Without the gate the job fails on
  # every push to main until someone notices, and a permanently red main teaches everyone
  # to ignore the colour. Skipping states the prerequisite instead of hiding it, and once
  # the variable is set a failure here means a real deploy failure again.
  deploy:
    name: deploy
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped to this job so the `check` job keeps read-only credentials.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install --frozen-lockfile

      # A project site is served from /<repo>/, not from the domain root, so every asset
      # reference needs that prefix or the page loads and then 404s on its own scripts.
      - name: Build for the project site
        run: bun apps/client/build.ts --public-path "/${{ github.event.repository.name }}/"

      # Without this, Pages runs the output through Jekyll, which drops files whose names
      # begin with an underscore.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      # No `enablement: true` — see the setup note on this job. It needs repository
      # administration rights, which GITHUB_TOKEN does not have, and it failed on the
      # first run here.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
