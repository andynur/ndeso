# Reproducible installs: bun.lock pins exact versions (TECH_STACK §4).
[install]
exact = true

# No `[test] coverage` key on purpose: an explicit `coverage = false` here *overrides*
# `bun test --coverage`, silently producing no report. Bun's default is already off, so
# the local loop stays fast and CI can opt in with the flag (.github/workflows/ci.yml).
